name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jtlsync_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, curl
          coverage: none

      - name: Lint PHP files
        run: find app public config cron scripts tests -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: jtlsync_test
          DB_USERNAME: root
          DB_PASSWORD: root
          TESTS_REQUIRE_DB: '1'
        run: php tests/run.php
